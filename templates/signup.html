<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
</head>
<body>
  <a href="/">Home</a>
  <h1>Sign Up</h1>
  <!-- Wisdom Jonathan: Signup page (signup.html) — create the signup form for username and password here.
       Use Bootstrap for styling. Form should POST to /signup. Add fields: username, password.
       Optionally show error/success messages using Jinja (e.g. {% if error %} ... {% endif %}). -->
  {% if error %}
    <p>{{ error }}</p>
  {% endif %}
  {% if success %}
    <p>{{ success }}</p>
  {% endif %}
  <form method="POST" action="/signup">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required><br>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required><br>
    <button type="submit">Sign Up</button>
    <a href="/">Cancel</a>
  </form>
</body>
</html>
